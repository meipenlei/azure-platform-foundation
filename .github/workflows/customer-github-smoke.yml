name: Customer GitHub Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - "tooling/customer-github/**"
      - "tooling/customer-init/templates/github/**"
      - ".github/workflows/customer-github-smoke.yml"

  pull_request:
    paths:
      - "tooling/customer-github/**"
      - "tooling/customer-init/templates/github/**"
      - ".github/workflows/customer-github-smoke.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    name: customer-github
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r tooling/customer-github/requirements.txt

      - name: Compile customer-github
        run: |
          python -m py_compile \
            tooling/customer-github/configure.py \
            tooling/customer-github/test_configure.py

      - name: Run customer-github unit tests
        run: |
          python -m unittest \
            tooling/customer-github/test_configure.py

      - name: Verify customer-github CLI
        run: |
          python tooling/customer-github/configure.py \
            --help > "$RUNNER_TEMP/customer-github-help.txt"

          grep -- "--project-dir" \
            "$RUNNER_TEMP/customer-github-help.txt"

          grep -- "--apply" \
            "$RUNNER_TEMP/customer-github-help.txt"

          echo "[PASS] customer-github CLI is available."

      - name: Verify generated GitHub workflow contract
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("tooling/customer-init/templates/github")

          workflows = (
              "terraform-plan.yml.j2",
              "terraform-apply.yml.j2",
              "terraform-governance-plan.yml.j2",
              "terraform-governance-apply.yml.j2",
          )

          for name in workflows:
              content = (root / name).read_text(encoding="utf-8")

              if "secrets.AZURE_" in content:
                  raise SystemExit(
                      f"[ERROR] Legacy secrets contract found in {name}"
                  )

              if "vars.AZURE_" not in content:
                  raise SystemExit(
                      f"[ERROR] GitHub variables contract missing in {name}"
                  )

              if "runs-on: ubuntu-24.04" not in content:
                  raise SystemExit(
                      f"[ERROR] Runner is not pinned to ubuntu-24.04 in {name}"
                  )

              if "actions/checkout@v7" not in content:
                  raise SystemExit(
                      f"[ERROR] checkout@v7 missing in {name}"
                  )

              print(f"[PASS] {name}")
          PY
