name: Validate APF Configuration

on:
  pull_request:
    paths:
      - "config/**"
      - "tooling/validate-config/**"
      - "tooling/customer-init/**"
      - ".github/workflows/validate-config.yml"

  push:
    branches:
      - main
    paths:
      - "config/**"
      - "tooling/validate-config/**"
      - "tooling/customer-init/**"
      - ".github/workflows/validate-config.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate APF schemas and configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tooling/validate-config/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tooling/validate-config/requirements.txt

      - name: Validate JSON Schema definitions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_dir = Path("config/schema")

          schemas = sorted(schema_dir.glob("*.schema.json"))

          if not schemas:
              raise SystemExit("No schema files found.")

          print("Azure Platform Foundation schema validation")
          print("-------------------------------------------")

          for schema_path in schemas:
              with schema_path.open("r", encoding="utf-8") as f:
                  schema = json.load(f)

              Draft202012Validator.check_schema(schema)

              print(f"[PASS] {schema_path.name}")

          print()
          print("All JSON Schema definitions are valid.")
          PY

      - name: Validate minimal Greenfield configuration
        run: |
          python tooling/validate-config/validate.py \
            --config-dir config/examples/greenfield-minimal \
            --schema-dir config/schema

  customer-init-smoke-test:
    name: Smoke test customer project initialization
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tooling/customer-init/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tooling/customer-init/requirements.txt

      - name: Generate customer project
        run: |
          python tooling/customer-init/init.py \
            --config-dir config/examples/greenfield-minimal \
            --output-dir "${RUNNER_TEMP}/apf-customer-project"

      - name: Verify generated customer project
        run: |
          PROJECT="${RUNNER_TEMP}/apf-customer-project"

          required_files=(
            ".foundation/metadata.yaml"
            ".gitignore"
            "README.md"
            "config/foundation.yaml"
            "config/customer.yaml"
            "config/platform.yaml"
            "levels/level0/.gitkeep"
            "levels/level1/.gitkeep"
            "levels/level2/.gitkeep"
            "levels/level3/.gitkeep"
            "levels/level4/.gitkeep"
            "governance/policies/.gitkeep"
            "governance/permissions/.gitkeep"
            "governance/exceptions/.gitkeep"
            "landing-zones/profiles/.gitkeep"
            "execution/.gitkeep"
            "docs/decisions/.gitkeep"
          )

          echo "Verifying generated APF customer project"
          echo "----------------------------------------"

          for file in "${required_files[@]}"; do
            if [[ ! -f "${PROJECT}/${file}" ]]; then
              echo "[FAIL] Missing: ${file}"
              exit 1
            fi

            echo "[PASS] ${file}"
          done

          echo
          echo "Generated customer project structure is valid."

      - name: Verify existing project protection
        run: |
          PROJECT="${RUNNER_TEMP}/apf-customer-project"

          set +e

          python tooling/customer-init/init.py \
            --config-dir config/examples/greenfield-minimal \
            --output-dir "${PROJECT}"

          exit_code=$?

          set -e

          if [[ ${exit_code} -eq 0 ]]; then
            echo "[FAIL] customer-init unexpectedly overwrote an existing project."
            exit 1
          fi

          echo "[PASS] Existing non-empty project was protected."