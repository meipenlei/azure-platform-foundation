name: Validate APF Configuration

on:
  pull_request:
    branches:
      - main
    paths:
      - "config/**"
      - "foundation/**"
      - "tooling/validate-config/**"
      - "tooling/customer-init/**"
      - ".github/workflows/validate-config.yml"

  push:
    branches:
      - main
    paths:
      - "config/**"
      - "foundation/**"
      - "tooling/validate-config/**"
      - "tooling/customer-init/**"
      - ".github/workflows/validate-config.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate APF schemas and configuration
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tooling/validate-config/requirements.txt

      - name: Validate JSON Schema definitions
        run: |
          python - <<'PY'
          from pathlib import Path

          import json
          from jsonschema import Draft202012Validator

          schema_dir = Path("config/schema")

          schema_files = sorted(
              schema_dir.glob("*.schema.json")
          )

          if not schema_files:
              raise SystemExit(
                  "[ERROR] No JSON Schema definitions found."
              )

          for schema_file in schema_files:
              with schema_file.open(
                  "r",
                  encoding="utf-8",
              ) as handle:
                  schema = json.load(handle)

              Draft202012Validator.check_schema(schema)

              print(
                  f"[PASS] {schema_file}"
              )

          print()
          print(
              "All JSON Schema definitions are valid."
          )
          PY

      - name: Validate minimal Greenfield configuration
        run: |
          python tooling/validate-config/validate.py \
            --config-dir config/examples/greenfield-minimal \
            --schema-dir config/schema


  customer-init-smoke-test:
    name: Customer Init Smoke Test
    runs-on: ubuntu-24.04
    needs:
      - validate

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
      
      - name: Install customer-bootstrap dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r tooling/customer-bootstrap/requirements.txt

      - name: Compile customer-bootstrap
        run: |
          python -m py_compile \
            tooling/customer-bootstrap/bootstrap.py

      - name: Verify customer-bootstrap CLI
        run: |
          python tooling/customer-bootstrap/bootstrap.py \
            --help > "$RUNNER_TEMP/customer-bootstrap-help.txt"

          grep -- "--project-dir" \
            "$RUNNER_TEMP/customer-bootstrap-help.txt"

          grep -- "--apply" \
            "$RUNNER_TEMP/customer-bootstrap-help.txt"

          grep -- "--governance" \
            "$RUNNER_TEMP/customer-bootstrap-help.txt"

          grep -- "--keep-temporary-state-access" \
            "$RUNNER_TEMP/customer-bootstrap-help.txt"

      - name: Install customer-init dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tooling/customer-init/requirements.txt

      - name: Prepare smoke-test configuration
        env:
          APF_GITHUB_OWNER: ${{ github.repository_owner }}
          APF_GITHUB_REPOSITORY: ${{ github.event.repository.name }}
        run: |
          rm -rf "${RUNNER_TEMP}/apf-config"

          cp -R \
            config/examples/greenfield-minimal \
            "${RUNNER_TEMP}/apf-config"

          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          config_dir = (
            Path(os.environ["RUNNER_TEMP"])
            / "apf-config"
          )
          #
          # Smoke tests always consume the current development
          # version of the Foundation.
          #
          foundation_path = (
              config_dir / "foundation.yaml"
          )

          foundation = yaml.safe_load(
              foundation_path.read_text(
                  encoding="utf-8"
              )
          )

          foundation["foundation"]["version"] = "main"

          foundation_path.write_text(
              yaml.safe_dump(
                  foundation,
                  sort_keys=False,
              ),
              encoding="utf-8",
          )

          #
          # GitHub discovery requires a real repository.
          # Use the repository executing this workflow.
          #
          platform_path = (
              config_dir / "platform.yaml"
          )

          platform = yaml.safe_load(
              platform_path.read_text(
                  encoding="utf-8"
              )
          )

          platform["execution"]["provider"] = "github"

          platform.setdefault(
              "execution",
              {}
          ).setdefault(
              "github",
              {}
          )

          platform["execution"]["github"]["owner"] = (
              os.environ["APF_GITHUB_OWNER"]
          )

          platform["execution"]["github"]["repository"] = (
              os.environ["APF_GITHUB_REPOSITORY"]
          )

          platform_path.write_text(
              yaml.safe_dump(
                  platform,
                  sort_keys=False,
              ),
              encoding="utf-8",
          )
          PY

      - name: Generate customer project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "${RUNNER_TEMP}/apf-customer-project"

          python tooling/customer-init/init.py \
            --config-dir "${RUNNER_TEMP}/apf-config" \
            --output-dir "${RUNNER_TEMP}/apf-customer-project" \
            --schema-dir config/schema

      - name: Verify generated customer project
        run: |
          set -euo pipefail

          #
          # Repository root
          #
          test -f "${RUNNER_TEMP}/apf-customer-project/README.md"
          test -f "${RUNNER_TEMP}/apf-customer-project/.gitignore"

          #
          # APF metadata
          #
          test -f \
            "${RUNNER_TEMP}/apf-customer-project/.foundation/metadata.yaml"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/.foundation/discovery.yaml"

          #
          # Authoritative customer configuration
          #
          test -f \
            "${RUNNER_TEMP}/apf-customer-project/config/foundation.yaml"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/config/customer.yaml"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/config/platform.yaml"

          #
          # Level 0 bootstrap root
          #
          test -f \
            "${RUNNER_TEMP}/apf-customer-project/levels/level0/bootstrap/versions.tf"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/levels/level0/bootstrap/providers.tf"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/levels/level0/bootstrap/variables.tf"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/levels/level0/bootstrap/main.tf"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/levels/level0/bootstrap/outputs.tf"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/levels/level0/bootstrap/generated.auto.tfvars.json"

          #
          # Level 0 is no longer an empty placeholder.
          #
          test ! -f \
            "${RUNNER_TEMP}/apf-customer-project/levels/level0/.gitkeep"

          #
          # Remaining Foundation levels remain placeholders.
          #
          test -f \
            "${RUNNER_TEMP}/apf-customer-project/levels/level1/.gitkeep"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/levels/level2/.gitkeep"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/levels/level3/.gitkeep"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/levels/level4/.gitkeep"

          #
          # Governance skeleton
          #
          test -f \
            "${RUNNER_TEMP}/apf-customer-project/governance/policies/.gitkeep"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/governance/permissions/.gitkeep"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/governance/exceptions/.gitkeep"

          #
          # Other generated skeleton directories
          #
          test -f \
            "${RUNNER_TEMP}/apf-customer-project/landing-zones/profiles/.gitkeep"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/execution/.gitkeep"

          test -f \
            "${RUNNER_TEMP}/apf-customer-project/docs/decisions/.gitkeep"

          echo
          echo "[PASS] Generated customer project structure is valid."

      - name: Verify generated GitHub workflows
        run: |
          set -euo pipefail

          WORKFLOW_DIR="${RUNNER_TEMP}/apf-customer-project/.github/workflows"

          test -f "${WORKFLOW_DIR}/terraform-plan.yml"
          test -f "${WORKFLOW_DIR}/terraform-apply.yml"
          test -f "${WORKFLOW_DIR}/terraform-governance-plan.yml"
          test -f "${WORKFLOW_DIR}/terraform-governance-apply.yml"

          echo "[PASS] All Level 0 GitHub workflows were generated."

      - name: Verify generated workflow configuration
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          project = (
              Path(os.environ["RUNNER_TEMP"])
              / "apf-customer-project"
          )

          workflow_dir = (
              project
              / ".github"
              / "workflows"
          )

          workflows = (
              "terraform-plan.yml",
              "terraform-apply.yml",
              "terraform-governance-plan.yml",
              "terraform-governance-apply.yml",
          )

          for workflow_name in workflows:
              path = workflow_dir / workflow_name
              content = path.read_text(encoding="utf-8")

              if 'terraform_version: "1.17.1"' not in content:
                  raise SystemExit(
                      f"[ERROR] Terraform 1.17.1 not found in "
                      f"{workflow_name}"
                  )

              if "id-token: write" not in content:
                  raise SystemExit(
                      f"[ERROR] OIDC permission missing in "
                      f"{workflow_name}"
                  )

              if "azure/login@v3" not in content:
                  raise SystemExit(
                      f"[ERROR] Azure OIDC login missing in "
                      f"{workflow_name}"
                  )

              print(
                  f"[PASS] {workflow_name}"
              )

          print()
          print(
              "All generated GitHub workflows are valid."
          )
          PY

      - name: Verify Level 0 workflow security boundaries
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          workflow_dir = (
              Path(os.environ["RUNNER_TEMP"])
              / "apf-customer-project"
              / ".github"
              / "workflows"
          )

          plan = (
              workflow_dir
              / "terraform-plan.yml"
          ).read_text(encoding="utf-8")

          apply = (
              workflow_dir
              / "terraform-apply.yml"
          ).read_text(encoding="utf-8")

          governance_plan = (
              workflow_dir
              / "terraform-governance-plan.yml"
          ).read_text(encoding="utf-8")

          governance_apply = (
              workflow_dir
              / "terraform-governance-apply.yml"
          ).read_text(encoding="utf-8")

          assert "AZURE_PLAN_CLIENT_ID" in plan
          assert "AZURE_APPLY_CLIENT_ID" in apply

          assert (
              "environment:\n      name: apf-level0"
              in apply
          )

          assert "AZURE_GOVERNANCE_CLIENT_ID" in governance_plan
          assert "AZURE_GOVERNANCE_CLIENT_ID" in governance_apply

          assert (
              "environment:\n      name: apf-governance"
              in governance_plan
          )

          assert (
              "environment:\n      name: apf-governance"
              in governance_apply
          )

          print(
              "[PASS] Level 0 execution identities are separated."
          )

          print(
              "[PASS] Governance workflows use the "
              "apf-governance environment."
          )
          PY

      - name: Verify GitHub discovery metadata
        env:
          APF_GITHUB_OWNER: ${{ github.repository_owner }}
          APF_GITHUB_REPOSITORY: ${{ github.event.repository.name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          project = (
              Path(os.environ["RUNNER_TEMP"])
              / "apf-customer-project"
          )

          discovery_path = (
              project
              / ".foundation"
              / "discovery.yaml"
          )

          discovery = yaml.safe_load(
              discovery_path.read_text(
                  encoding="utf-8"
              )
          )

          github = discovery["github"]

          assert github["owner"] == (
              os.environ["APF_GITHUB_OWNER"]
          )

          assert github["repository"] == (
              os.environ["APF_GITHUB_REPOSITORY"]
          )

          assert github["owner_id"]
          assert github["repository_id"]

          print(
              "[PASS] Immutable GitHub identity "
              "metadata was generated."
          )

          print(
              f"       Owner ID: "
              f"{github['owner_id']}"
          )

          print(
              f"       Repository ID: "
              f"{github['repository_id']}"
          )
          PY

      - name: Verify generated Terraform inputs
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          project = (
              Path(os.environ["RUNNER_TEMP"])
              / "apf-customer-project"
          )

          tfvars_path = (
              project
              / "levels"
              / "level0"
              / "bootstrap"
              / "generated.auto.tfvars.json"
          )

          with tfvars_path.open(
              "r",
              encoding="utf-8",
          ) as handle:
              tfvars = json.load(handle)

          required_values = (
              "tenant_id",
              "subscription_id",
              "location",
              "name_prefix",
              "github_owner",
              "github_owner_id",
              "github_repository",
              "github_repository_id",
              "github_apply_environment",
              "github_governance_environment",
          )

          missing = [
              key
              for key in required_values
              if not tfvars.get(key)
          ]

          if missing:
              raise SystemExit(
                  "[ERROR] Missing generated Terraform "
                  f"inputs: {', '.join(missing)}"
              )

          assert (
              tfvars["github_apply_environment"]
              == "apf-level0"
          )

          assert (
              tfvars["github_governance_environment"]
              == "apf-governance"
          )

          print(
              "[PASS] Generated Terraform inputs are valid."
          )
          PY

      - name: Terraform format check for generated bootstrap root
        working-directory: ${{ runner.temp }}/apf-customer-project/levels/level0/bootstrap
        run: |
          terraform fmt -check -recursive

      - name: Initialize generated bootstrap root
        working-directory: ${{ runner.temp }}/apf-customer-project/levels/level0/bootstrap
        run: |
          terraform init \
            -backend=false

      - name: Validate generated bootstrap root
        working-directory: ${{ runner.temp }}/apf-customer-project/levels/level0/bootstrap
        run: |
          terraform validate

      - name: Verify overwrite protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          python tooling/customer-init/init.py \
            --config-dir "${RUNNER_TEMP}/apf-config" \
            --output-dir "${RUNNER_TEMP}/apf-customer-project" \
            --schema-dir config/schema

          EXIT_CODE=$?

          set -e

          if [ "${EXIT_CODE}" -eq 0 ]; then
            echo \
              "[ERROR] customer-init unexpectedly overwrote an existing project."

            exit 1
          fi

          echo
          echo \
            "[PASS] Existing non-empty project was protected."